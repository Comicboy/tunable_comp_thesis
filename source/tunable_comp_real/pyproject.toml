[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tunable-comp-real"
version = "0.1.0"
description = "Real UR5e + Wuji Hand 2 side of the tunable-compliance thesis: hand model, fingertip admittance, glove processing, recording. No Isaac Lab; runs in the `teleop` env next to quest_teleop2."
requires-python = ">=3.10"
dependencies = ["numpy", "pyyaml"]

[tool.setuptools.packages.find]
include = ["tunable_comp_real*"]