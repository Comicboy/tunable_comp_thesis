# AdaptiveOptimizerAnalytical for WebXR/Quest input driving the Wuji Hand 2
# (LEFT HAND).
#
# The vendor's adaptive_analytical_wuji_glove_wuji_hand_2_left.yaml with
# `thumb_skip_pip` removed -- that one is glove-specific (their SDK
# reconstructs thumb MCP badly; WebXR reports a full skeleton). The glove
# side is otherwise hand-model-agnostic, feeding the same 21 MediaPipe
# keypoints this project's WebXR adapter produces.
#
# Paths are relative to this file's directory.

optimizer:
  type: "AdaptiveOptimizerAnalytical"
  urdf_path: "../../wuji-retargeting/wuji_retargeting/wuji-description/hand2/hand2_beta1/body/urdf/left.urdf"
  mjcf_path: "../../wuji-retargeting/wuji_retargeting/wuji-description/hand2/hand2_beta1/body/mjcf/left.xml"
  # Anatomical link names, thumb..pinky. Verbatim from the vendor.
  link_naming:
    prefix: "l_"
    palm:    "wrist"
    fingers: [thumb, index_finger, middle_finger, ring_finger, pinky]
    pip:     "{finger}_middle"        # PIP
    dip:     "{finger}_distal"        # DIP
    tip:     "{finger}_tip"           # fingertip
    link1:   "{finger}_proximal_abd"  # MCP abduction link (finger-plane ref)

retarget:
  huber_delta: 2.0
  huber_delta_dir: 0.5
  norm_delta: 0.04
  w_pos: 1.0
  w_dir: 2.0
  scaling: 1.0
  w_full_hand: 1.0
  # Style penalty: discourage hyperextension and uncoupled PIP/DIP curl
  w_hyper: 1.0           # PIP/DIP joints below soft_min are penalized quadratically
  soft_min: 0.0          # joint angle threshold (rad); 0 = no negative angles allowed
  w_couple: 0.1          # DIP pulled toward couple_ratio * PIP per finger
  couple_ratio: 0.7      # biomechanical (DIP curls ~70% of PIP)
  lp_alpha: 0.2

  segment_scaling:
    thumb:  [1.0, 1.0, 1.0]
    index:  [1.0, 1.0, 1.0]
    middle: [1.0, 1.0, 1.0]
    ring:   [1.0, 1.0, 1.0]
    pinky:  [1.0, 1.0, 1.0]

  pinch_thresholds:
    index:  { d1: 2.0, d2: 4.0 }
    middle: { d1: 2.0, d2: 4.0 }
    ring:   { d1: 2.0, d2: 4.0 }
    pinky:  { d1: 2.0, d2: 4.0 }

  # A hand-model correction, not an input-device one: the same glove input
  # is (0, 0, 0) on the first-generation model and this on the Hand 2.
  mediapipe_rotation:
    x: 180.0
    y: 0.0
    z: -90.0

  wrist_offset_cm: [0.0, 0.0, 0.0]   # disabled: per-SN calibrated URDF, no extra bias
  thumb_offset_cm: [0.0, 0.0, 0.0]   # disabled: same reason

render:
  camera:
    azimuth: 135
    elevation: -20
    distance: 0.5
